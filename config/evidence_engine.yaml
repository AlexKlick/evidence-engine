# evidence_engine runtime configuration.
# Endpoints mirror the workstation's canonical model lanes (MODEL_CONTRACT.json
# in /home/alexk/documents is authoritative; `ee doctor` warns on drift).

database:
  # Empty dsn -> SQLite at paths.sqlite_path. Set a Postgres DSN to use the
  # host cluster (127.0.0.1:5432, pgvector available) or any other PG.
  dsn: ""
  sqlite_path: "data/evidence_engine.db"

searxng:
  base_url: "http://127.0.0.1:8018"
  timeout_seconds: 10
  max_results_per_query: 10
  delay_seconds: 0.5
  language: "en"

llm:
  # Provider: "local" (loopback text-main) or "minimax" (hosted MiniMax M2).
  # Hosted inference over collected evidence requires the EXTERNAL_INFERENCE
  # right on every involved source — policy v2 authorizes it for searxng
  # derived data (see config/source_policies.yaml).
  # Env overrides: EE_LLM_PROVIDER, EE_LLM_BASE_URL, EE_LLM_MODEL.
  provider: "local"
  base_url: "http://127.0.0.1:18000/v1"
  model: "Qwen/Qwen3.8-27B"
  timeout_seconds: 240
  max_batch_evidences: 6   # evidences per extraction call
  max_evidences_per_run: 24
  minimax:
    # Coding-Plan-covered path is the Anthropic-compatible endpoint; the
    # OpenAI-style /v1/chat/completions returns 1008 insufficient balance.
    base_url: "https://api.minimax.io/anthropic/v1"
    model: "MiniMax-M2"
    api_key_env: "ANTHROPIC_AUTH_TOKEN_MINIMAX2"

embeddings:
  base_url: "http://127.0.0.1:6900/v1"
  model: "Qwen/Qwen3-Embedding-0.6B"
  dim: 1024
  timeout_seconds: 60

pipeline:
  semantic_duplicate_threshold: 0.97
  cluster_similarity_threshold: 0.72
  use_llm_extraction: true

paths:
  reports_dir: "reports"
  ideas_dir: "ideas"

defaults:
  # Sources attempted when a vertical does not override `sources`.
  sources: ["searxng"]
  max_results_per_query: 10
